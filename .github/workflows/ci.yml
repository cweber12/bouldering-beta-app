name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check · Test · Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*

      - name: Format check (changed files)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npx prettier --check --ignore-unknown ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run --reporter=verbose --reporter=junit --outputFile=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Lint
        run: npx eslint .

      - name: Copy opencv.js to public/
        run: npm run setup:opencv

      - name: Build
        run: npx next build
